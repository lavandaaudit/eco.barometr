<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ECOPOLLUTANT TRACKER · WATER & SOIL MONITOR · PRO 2026</title>
    <style>
        :root {
            --bg: #020506;
            --accent: #00ff99;
            --secondary: #00cc99;
            --danger: #ff3366;
            --warning: #ffcc33;
            --glass: rgba(8, 18, 25, 0.96);
            --border: rgba(0, 255, 153, 0.35);
            --font-mono: 'Courier New', monospace;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            margin: 0;
            background: #000;
            color: #d0ffe6;
            font-family: var(--font-mono);
            overflow: hidden;
            min-height: 100vh;
            user-select: none;
        }

        #bg-canvas { position: fixed; inset: 0; z-index: 1; opacity: 0.6; }

        #ui-wrapper {
            position: relative;
            z-index: 100;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px; /* Великі відступи */
        }

        #ui-dock {
            display: flex;
            gap: 30px;
            max-width: 1300px;
            width: 100%;
            pointer-events: none;
            transform: scale(0.85); /* Масштаб 85% */
            transform-origin: center;
        }

        /* ЛІВИЙ БЛОК */
        #pollution-gauge {
            width: 360px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 4px;
            backdrop-filter: blur(25px);
            padding: 20px;
            box-shadow: 0 0 40px rgba(0, 255, 153, 0.1);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #pollution-gauge::before {
            content: "";
            position: absolute;
            top: -1px; left: -1px; width: 20px; height: 20px;
            border-top: 2px solid var(--accent);
            border-left: 2px solid var(--accent);
        }

        #pollution-gauge::after {
            content: "";
            position: absolute;
            bottom: -1px; right: -1px; width: 20px; height: 20px;
            border-bottom: 2px solid var(--accent);
            border-right: 2px solid var(--accent);
        }

        .inst-header {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            text-align: center;
            font-weight: 900;
            display: flex;
            justify-content: space-between;
        }

        #alert-zone {
            min-height: 45px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .alert-item {
            background: rgba(255,51,102,0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            font-size: 9px;
            padding: 6px;
            border-radius: 2px;
            text-align: center;
            animation: pulse-alert 2.2s infinite;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .alert-item.warning {
            background: rgba(255,204,51,0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
        }

        .alert-item.safe {
            background: rgba(0,255,153,0.05);
            border: 1px solid var(--accent);
            color: var(--accent);
            animation: none;
        }

        @keyframes pulse-alert {
            0%,100% { opacity: 1; filter: brightness(1.2); }
            50% { opacity: 0.6; filter: brightness(0.8); }
        }

        .viz-container {
            width: 100%;
            height: 180px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0,255,153,0.1);
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .data-box {
            border: 1px solid rgba(0,255,153,0.15);
            padding: 8px;
            background: rgba(0,20,10,0.3);
        }

        .data-box label {
            display: block;
            font-size: 8px;
            color: var(--accent);
            opacity: 0.7;
            margin-bottom: 4px;
        }

        .data-box b {
            font-size: 14px;
            color: #fff;
        }

        .location-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-top: 10px;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .location-grid::-webkit-scrollbar { width: 3px; }
        .location-grid::-webkit-scrollbar-thumb { background: var(--border); }

        .loc-btn {
            background: rgba(0, 255, 153, 0.05);
            border: 1px solid var(--border);
            color: var(--accent);
            font-size: 8px;
            padding: 6px 4px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .loc-btn:hover { background: rgba(0, 255, 153, 0.15); }
        .loc-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        #sys-log {
            font-size: 8px;
            color: var(--accent);
            opacity: 0.6;
            height: 50px;
            margin-top: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
            border-top: 1px solid var(--border);
            padding-top: 8px;
            line-height: 1.4;
        }

        /* ПРАВИЙ БЛОК: АНАЛІТИКА */
        #data-projection {
            flex: 1;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .proj-section {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            background: var(--glass);
            padding: 20px;
            border: 1px solid var(--border);
        }

        .proj-item { display: flex; flex-direction: column; }

        .proj-label {
            font-size: 9px;
            color: var(--accent);
            letter-spacing: 1px;
            opacity: 0.6;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .proj-value {
            font-size: 22px;
            color: #fff;
            font-weight: 900;
        }

        .proj-value span {
            font-size: 10px;
            opacity: 0.5;
            margin-left: 4px;
        }

        #eco-desc {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 20px;
            flex: 1;
            font-size: 11px;
            line-height: 1.8;
            color: #b0ffd0;
            position: relative;
        }

        #eco-desc::before {
            content: "SYSTEM_REPORT_v2.6";
            position: absolute;
            top: -7px; left: 10px;
            background: #000;
            color: var(--accent);
            font-size: 8px;
            padding: 0 5px;
        }

        #detailed-desc { white-space: pre-wrap; display: block; }

        .proj-title-big {
            font-size: 48px;
            letter-spacing: 15px;
            color: var(--accent);
            opacity: 0.15;
            text-align: right;
            margin-top: auto;
            text-transform: uppercase;
            font-weight: 900;
        }

        #custom-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        #custom-controls input {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--accent);
            font-size: 10px;
            padding: 8px;
            outline: none;
        }

        #custom-controls button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 15px;
            font-size: 10px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        #custom-controls button:hover { opacity: 0.8; }

        /* МОБІЛЬНА АДАПТАЦІЯ */
        @media (max-width: 1100px) {
            #ui-dock {
                flex-direction: column;
                transform: scale(1);
                padding: 20px;
                gap: 20px;
                pointer-events: auto;
                overflow-y: auto;
                justify-content: flex-start;
                height: 100%;
                width: 100%;
            }
            #ui-wrapper {
                padding: 10px;
                align-items: flex-start;
                overflow-y: auto;
            }
            #pollution-gauge, #data-projection {
                width: 100%;
                max-width: none;
            }
            .proj-section { grid-template-columns: 1fr 1fr; }
            .proj-title-big {
                font-size: 24px;
                text-align: center;
                margin: 20px 0;
            }
            body { overflow-y: auto; }
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div id="ui-wrapper">
        <div id="ui-dock">
            <div id="pollution-gauge">
                <div class="inst-header">
                    <span>ECO_SCANNER_PRO</span>
                    <span id="real-time-clock">--:--:--</span>
                </div>
                <div id="alert-zone"></div>
                <div class="viz-container">
                    <canvas id="pollution-viz"></canvas>
                </div>
                <div class="data-grid">
                    <div class="data-box"><label>ЛОКАЦІЯ</label><b id="locName">---</b></div>
                    <div class="data-box"><label>pH БАЛАНС</label><b id="phVal">--</b></div>
                    <div class="data-box"><label>ТОКСИЧНІСТЬ</label><b id="toxinLvl">--</b></div>
                    <div class="data-box"><label>НІТРАТИ</label><b id="nitrates">--</b> <small>мг/л</small></div>
                </div>
                <div class="location-grid" id="locContainer"></div>
                <div id="custom-controls">
                    <input type="text" id="c-lat" placeholder="LAT">
                    <input type="text" id="c-lon" placeholder="LON">
                    <button id="search-btn">SCAN</button>
                </div>
                <div id="sys-log"></div>
            </div>

            <div id="data-projection">
                <div class="proj-section">
                    <div class="proj-item">
                        <div class="proj-label">ВАЖКІ МЕТАЛИ</div>
                        <div class="proj-value" id="heavyMetals">--<span>μg/L</span></div>
                    </div>
                    <div class="proj-item">
                        <div class="proj-label">ФОСФАТИ (PO4)</div>
                        <div class="proj-value" id="phosphates">--<span>мг/л</span></div>
                    </div>
                    <div class="proj-item">
                        <div class="proj-label">ПЕСТИЦИДИ</div>
                        <div class="proj-value" id="pesticides">--<span>ppb</span></div>
                    </div>
                    <div class="proj-item">
                        <div class="proj-label">СТАТУС РИЗИКУ</div>
                        <div class="proj-value" id="riskLevel" style="font-size: 18px;">---</div>
                    </div>
                </div>
                <div class="proj-section" style="grid-template-columns: repeat(3, 1fr);">
                    <div class="proj-item">
                        <div class="proj-label">SOIL MOISTURE</div>
                        <div class="proj-value" id="soilMoist">--<span>%</span></div>
                    </div>
                    <div class="proj-item">
                        <div class="proj-label">SOIL TEMP</div>
                        <div class="proj-value" id="soilTemp">--<span>°C</span></div>
                    </div>
                    <div class="proj-item">
                        <div class="proj-label">AQI (AIR)</div>
                        <div class="proj-value" id="airAqi">--</div>
                    </div>
                </div>
                <div id="eco-desc">
                    <b style="color:var(--accent); font-size: 11px;">[ ECO_ANALYTIC_REPORT_2026 ]</b><br><br>
                    <span id="detailed-desc">Syncing with Neural Grid...</span>
                </div>
                <div class="proj-title-big" id="locBigName">SYSTEM_IDLE</div>
            </div>
        </div>
    </div>

    <script>
        const LOCATIONS = [
            { name: "Київ", lat: 50.45, lon: 30.52 }, { name: "Харків", lat: 50.00, lon: 36.23 },
            { name: "Львів", lat: 49.84, lon: 24.03 }, { name: "Одеса", lat: 46.48, lon: 30.73 },
            { name: "Дніпро", lat: 48.46, lon: 35.04 }, { name: "Донецьк", lat: 48.01, lon: 37.80 },
            { name: "London", lat: 51.51, lon: -0.13 }, { name: "New York", lat: 40.71, lon: -74.01 },
            { name: "Tokyo", lat: 35.68, lon: 139.69 }, { name: "Berlin", lat: 52.52, lon: 13.40 },
            { name: "Paris", lat: 48.86, lon: 2.35 }, { name: "Sydney", lat: -33.86, lon: 151.20 }
        ];

        let currentData = { ph: 7.0, nitrates: 0, toxins: 0, metals: 0, moisture: 0, soilTemp: 0, aqi: 0, risk: "NORMAL" };
        let selectedLoc = LOCATIONS[0];

        const locContainer = document.getElementById('locContainer');
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const vizCanvas = document.getElementById('pollution-viz');
        const vizCtx = vizCanvas.getContext('2d');

        LOCATIONS.forEach(loc => {
            const btn = document.createElement('div');
            btn.className = 'loc-btn';
            btn.textContent = loc.name;
            btn.onclick = () => selectLocation(loc, btn);
            locContainer.appendChild(btn);
        });

        function selectLocation(loc, btn) {
            selectedLoc = loc;
            document.querySelectorAll('.loc-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            refreshData();
        }

        function updateTime() {
            document.getElementById('real-time-clock').textContent = new Date().toLocaleTimeString('uk-UA');
        }
        setInterval(updateTime, 1000);

        async function fetchEnvironmentalData(lat, lon) {
            try {
                log(`QUERYING_NODE: ${lat.toFixed(2)}, ${lon.toFixed(2)}`);
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=soil_temperature_0cm,soil_moisture_0_to_1cm,precipitation`);
                const weatherData = await weatherRes.json();
                const airRes = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=european_aqi,pm10,pm2_5,nitrogen_dioxide,sulphur_dioxide`);
                const airData = await airRes.json();

                const hw = weatherData.hourly;
                const ca = airData.current;

                currentData.ph = 7.2 - (ca.sulphur_dioxide * 0.05) - (ca.nitrogen_dioxide * 0.02);
                if (currentData.ph < 5.5) currentData.ph = 5.5; 
                currentData.nitrates = (hw.soil_moisture_0_to_1cm[0] * 10) + (hw.precipitation[0] * 2.5) + (ca.pm10 * 0.1);
                currentData.toxins = (ca.pm2_5 * 0.005) + (ca.nitrogen_dioxide * 0.002);
                currentData.metals = ca.pm10 * 0.45;
                currentData.moisture = hw.soil_moisture_0_to_1cm[0] * 100;
                currentData.soilTemp = hw.soil_temperature_0cm[0];
                currentData.aqi = ca.european_aqi;

                if (currentData.nitrates > 15 || currentData.metals > 25 || currentData.ph < 6.0) currentData.risk = "CRITICAL";
                else if (currentData.nitrates > 8 || currentData.aqi > 60) currentData.risk = "ELEVATED";
                else currentData.risk = "STABLE";

                updateUI();
                log(`DATA_STREAM_SYNCED`);
            } catch (err) { log(`STREAM_ERROR: ${err.message}`); }
        }

        function updateUI() {
            document.getElementById('locName').textContent = selectedLoc.name;
            document.getElementById('locBigName').textContent = selectedLoc.name.toUpperCase();
            document.getElementById('phVal').textContent = currentData.ph.toFixed(2);
            document.getElementById('toxinLvl').textContent = currentData.toxins.toFixed(3);
            document.getElementById('nitrates').textContent = currentData.nitrates.toFixed(1);
            document.getElementById('heavyMetals').innerHTML = `${currentData.metals.toFixed(1)}<span>μg/L</span>`;
            document.getElementById('phosphates').innerHTML = `${(currentData.nitrates * 0.15).toFixed(2)}<span>мг/л</span>`;
            document.getElementById('pesticides').innerHTML = `${currentData.toxins.toFixed(2)}<span>ppb</span>`;
            const riskEl = document.getElementById('riskLevel');
            riskEl.textContent = currentData.risk;
            riskEl.style.color = currentData.risk === "CRITICAL" ? "var(--danger)" : currentData.risk === "ELEVATED" ? "var(--warning)" : "var(--accent)";
            document.getElementById('soilMoist').textContent = currentData.moisture.toFixed(1);
            document.getElementById('soilTemp').textContent = currentData.soilTemp.toFixed(1);
            document.getElementById('airAqi').textContent = currentData.aqi;
            updateAlerts();
            generateReport();
        }

        function updateAlerts() {
            const zone = document.getElementById('alert-zone');
            zone.innerHTML = '';
            const alerts = [];
            if (currentData.risk === "CRITICAL") alerts.push({ text: "!!! EMERGENCY: TOXIC THRESHOLD !!!", type: "danger" });
            if (currentData.ph < 6.5) alerts.push({ text: "ACIDIC CORROSION RISK", type: "warning" });
            if (!alerts.length) {
                const div = document.createElement('div');
                div.className = "alert-item safe";
                div.textContent = "> SYSTEM_STATUS: NOMINAL";
                zone.appendChild(div);
            } else alerts.forEach(a => {
                const div = document.createElement('div');
                div.className = `alert-item ${a.type}`;
                div.textContent = a.text;
                zone.appendChild(div);
            });
        }

        function generateReport() {
            let r = `[ МІСЦЕ: ${selectedLoc.name.toUpperCase()} ]\n\nАНАЛІЗ ГРУНТУ:\n- Вологість: ${currentData.moisture.toFixed(1)}%\n- Температура: ${currentData.soilTemp.toFixed(1)}°C\n\nАНАЛІЗ ВОДНОГО СЕРЕДОВИЩА:\n- pH: ${currentData.ph.toFixed(2)}\n- Нітрати: ${currentData.nitrates.toFixed(1)} мг/л\n\nВИСНОВОК: ${currentData.risk}`;
            document.getElementById('detailed-desc').innerText = r;
        }

        function log(m) {
            const l = document.getElementById('sys-log');
            const d = document.createElement('div');
            d.textContent = `> ${m}`;
            l.prepend(d);
            if (l.childNodes.length > 5) l.removeChild(l.lastChild);
        }

        async function refreshData() { await fetchEnvironmentalData(selectedLoc.lat, selectedLoc.lon); }

        document.getElementById('search-btn').onclick = () => {
            const lat = parseFloat(document.getElementById('c-lat').value);
            const lon = parseFloat(document.getElementById('c-lon').value);
            if (!isNaN(lat) && !isNaN(lon)) selectLocation({ name: `CUSTOM_SCAN`, lat, lon }, null);
        };

        const dots = Array.from({length: 50}, () => ({ x: Math.random() * 2000, y: Math.random() * 2000, v: Math.random() * 0.5 + 0.2 }));
        function drawBg() {
            bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight;
            bgCtx.fillStyle = '#000'; bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);
            dots.forEach(d => {
                d.y -= d.v; if (d.y < 0) d.y = bgCanvas.height;
                bgCtx.fillStyle = `rgba(0, 255, 153, ${0.1 + d.v*0.2})`;
                bgCtx.fillRect(d.x % bgCanvas.width, d.y, 2, 2);
            });
            requestAnimationFrame(drawBg);
        }

        function drawViz(t) {
            vizCanvas.width = vizCanvas.parentElement.clientWidth; vizCanvas.height = vizCanvas.parentElement.clientHeight;
            vizCtx.clearRect(0,0,vizCanvas.width,vizCanvas.height);
            const level = currentData.risk === "CRITICAL" ? 0.9 : 0.2;
            const x = vizCanvas.width/2; const y = vizCanvas.height/2;
            const r = 60 + level * 40 + Math.sin(t*0.002)*10;
            const g = vizCtx.createRadialGradient(x,y,0,x,y,r);
            const color = currentData.risk === "CRITICAL" ? '255,50,100' : '0,255,153';
            g.addColorStop(0, `rgba(${color}, 0.2)`); g.addColorStop(1, 'transparent');
            vizCtx.fillStyle = g; vizCtx.beginPath(); vizCtx.arc(x,y,r,0,Math.PI*2); vizCtx.fill();
            requestAnimationFrame(drawViz);
        }

        window.onload = async () => {
            drawBg(); drawViz(0);
            await selectLocation(LOCATIONS[0], document.querySelector('.loc-btn'));
            setInterval(refreshData, 60000);
        };
    </script>
</body>
</html>
